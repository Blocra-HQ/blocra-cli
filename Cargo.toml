[package]
name = "blocra"
version = "0.3.0"
edition = "2021"
rust-version = "1.75"
description = "Signed, verifiable on-chain traction reports for your project, from your terminal or CI."
license = "MIT"
repository = "https://github.com/Blocra-HQ/blocra-cli"
homepage = "https://github.com/Blocra-HQ/blocra-cli#readme"
readme = "README.md"
keywords = ["web3", "analytics", "attestation", "stellar", "cli"]
categories = ["command-line-utilities", "cryptography"]
include = ["src/**", "defaults.json", "README.md", "LICENSE", "Cargo.toml"]

[lib]
name = "blocra"
path = "src/lib.rs"

[[bin]]
name = "blocra"
path = "src/main.rs"

[dependencies]
base64 = "0.22"
ed25519-dalek = "2.2"
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
ureq = { version = "2.12", default-features = false, features = ["tls"] }
url = "2.5"

[profile.release]
lto = true
strip = true
codegen-units = 1
